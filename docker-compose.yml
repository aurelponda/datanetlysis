services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_BYTES: "52428800"
      CSV_CHUNK_ROWS: "10000"
      MAX_CONCURRENT_JOBS: "1"
      MAX_STATS_DB_BYTES: "67108864"
      CORS_ORIGINS: ""
    read_only: true
    tmpfs:
      - /tmp/data-analyzer:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
