services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_BYTES: "52428800"
      CSV_CHUNK_ROWS: "10000"
      CORS_ORIGINS: ""
    read_only: true
    tmpfs:
      - /tmp/data-analyzer:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
