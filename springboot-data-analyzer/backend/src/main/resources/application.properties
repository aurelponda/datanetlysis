server.port=${PORT:8080}
spring.application.name=data-analyzer
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_MB:10}MB
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD_MB:10}MB
spring.jackson.serialization.write-dates-as-timestamps=false
app.max-upload-mb=${APP_MAX_UPLOAD_MB:10}
app.max-rows=${APP_MAX_ROWS:100000}
app.max-columns=${APP_MAX_COLUMNS:200}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}
app.session-ttl-minutes=${APP_SESSION_TTL_MINUTES:30}
