<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Analyze CSV datasets securely and efficiently.">
  <title>Data Analyzer</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header><span class="eyebrow">DATA WORKSPACE</span><h1>Understand your data.</h1><p>Upload a CSV to see its shape, missing values, numeric summaries, and a small preview.</p></header>
    <form id="upload-form" class="upload-card">
      <label class="dropzone" for="csv-file"><span class="upload-icon">↑</span><strong>Choose a CSV file</strong><span>Maximum size: 50 MB</span><input id="csv-file" name="file" type="file" accept=".csv,text/csv" required></label>
      <div class="form-row"><span id="file-name">No file selected</span><button type="submit">Analyze file</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <section id="results" hidden aria-live="polite"></section>
    <footer>CSV analysis runs in chunks. Your file is removed from the server after analysis.</footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
